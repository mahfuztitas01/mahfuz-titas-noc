<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mahfuz Titas NOC</title>
    <!-- SPA fallback for static hosting. The app uses HashRouter, so unmatched
         paths are redirected into the app's hash route (e.g. /repo/#/clients). -->
    <script>
      ;(function () {
        var l = window.location
        var base = l.pathname.split('/').slice(0, 2).join('/') + '/'
        var rest = l.pathname.slice(base.length).replace(/^\/+/, '')
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base
        if (rest) target += '#/' + rest
        target += (l.search || '') + (l.hash || '')
        l.replace(target)
      })()
    </script>
  </head>
  <body></body>
</html>
